services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: encore-db
    environment:
      POSTGRES_DB: encore
      POSTGRES_USER: encore_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - encore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encore_user -d encore"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: encore-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/encore
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

volumes:
  encore-data: