<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111b42" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>404 — Encore</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf9f5;color:#111b42;font:16px system-ui,sans-serif}
      main{max-width:560px;padding:36px}
      strong{color:#294be8;font-size:clamp(100px,25vw,190px);letter-spacing:-.09em;line-height:1}
      h1{font-size:clamp(32px,8vw,58px);letter-spacing:-.06em}
      p{color:#515873;line-height:1.7}
      a{display:inline-block;margin-top:14px;padding:14px 17px;background:#294be8;color:#fff;text-decoration:none;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <strong>404</strong>
      <h1>Este enlace ha perdido el ritmo.</h1>
      <p>La página que buscas no existe o se ha movido.</p>
      <a href="/">Volver a Encore</a>
    </main>
    <script>
      try {
        const requestedPath = `${window.location.pathname}${window.location.search}${window.location.hash}`;
        if (window.location.pathname !== '/') {
          window.sessionStorage.setItem('encore_static_route', requestedPath);
          window.location.replace('/');
        }
      } catch (error) {
        console.warn('No se pudo recuperar la ruta de la aplicación.', error);
      }
    </script>
  </body>
</html>
