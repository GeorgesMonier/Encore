spring.application.name=encore-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/encore}
spring.datasource.username=${DB_USER:encore_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:None}
payments.demo-mode=${PAYMENTS_DEMO_MODE:}
tickets.purchase-limits.normal=${TICKETS_NORMAL_PURCHASE_LIMIT:10}
tickets.purchase-limits.vip=${TICKETS_VIP_PURCHASE_LIMIT:5}



ticketmaster.api.key=${TICKETMASTER_API_KEY}
ticketmaster.sync.enabled=${TICKETMASTER_SYNC_ENABLED:false}
ticketmaster.sync.cities=${TICKETMASTER_SYNC_CITIES:Madrid,Barcelona,Valencia,Sevilla,Bilbao,Zaragoza,Málaga,Alicante,Granada}
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_pendiente_de_configurar}

jwt.secret=${JWT_SECRET}

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.model.embedding.text=google-genai

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# ===== PgVector =====
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768